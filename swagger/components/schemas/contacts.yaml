type: object
required:
  - _id
  - name
  - phoneNumber
  - contactType

properties:
  _id:
    description: "Contact's id"
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: "Contact's name"
    type: string
    example: "John Doe"
  phoneNumber:
    description: "Contact's phone number"
    type: string
    example: 126574748
  contactType:
    description: "Contact's phone type"
    type: string
    enum: ["work", "home", "personal"]
  email:
    description: "Contact's email"
    type: string
    example: test@gmail.com
  isFavourite:
    description: "Is contact favourite?"
    type: boolean
    example: true
  userId:
    description: "Contacts's parent id"
    type: string
    example: 65e4decdd286b30065d54af9
  photo:
    description: "Link to contacts's photo"
    type: string
    example: https://res.cloudinary.com/uqwgdu/image/upload/image.png
